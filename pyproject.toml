[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pict-model"
version = "0.1.0"
description = "Paired-IRF conditional posterior inference and deterministic baselines for TD-NIRS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "h5py>=3.12,<4",
  "numpy>=2.1,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.6,<2",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "tensorboard>=2.18,<3"]

[project.scripts]
tdnirs-audit = "tdnirs_posterior.cli.audit_data:main"
tdnirs-infer = "tdnirs_posterior.cli.infer:main"
tdnirs-profile = "tdnirs_posterior.cli.profile_resolution:main"
tdnirs-evaluate = "tdnirs_posterior.cli.evaluate:main"
tdnirs-test = "tdnirs_posterior.cli.test:main"
tdnirs-test-dtof-only = "tdnirs_posterior.cli.test_dtof_only:main"
tdnirs-report = "tdnirs_posterior.reporting:main"
tdnirs-compare-irf-ablation = "tdnirs_posterior.cli.compare_irf_ablation:main"
tdnirs-test-cnn = "tdnirs_posterior.cli.test_cnn:main"
tdnirs-test-ann = "tdnirs_posterior.cli.test_ann:main"
tdnirs-compare-baselines = "tdnirs_posterior.cli.compare_baselines:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tdnirs_posterior = ["report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
